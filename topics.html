<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Royale - Topics</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body class="bg-cyan">
    <main
      class="flex flex-col items-center justify-start w-full p-6 space-y-6 min-h-dvh md:p-12 lg:p-16 md:space-y-8"
    >
      <!-- Logo -->
      <a
        href="index.html"
        class="block w-full max-w-[260px] md:max-w-sm lg:max-w-lg"
      >
        <h1>
          <svg
            class="w-full overflow-visible"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 594 150"
            fill="none"
          >
            <g fill="#000">
              <path
                d="M52 89v-5h9v-4h5v-5h4v-9h5V38h-5V28h-4v-5h-5v-4h-9v-5H23v5h-9v4H9v5H5v10H0v28h5v9h4v5h5v4h9v5h5v5h5v4h9v5h14v5h19v-5H61v-5h-9v-4h-5v-5h5Zm-24-5v-4h-5v-5h-4v-9h-5V38h5V28h4v-5h5v-4h19v4h5v5h4v10h5v28h-5v9h-4v5h-5v4H28Z"
              />
              <path
                d="M141 84v5h-19v-9h-5v-5h5V42h-5v-4h19v46h5Zm-28 0h4v-4h-4v4Zm-5-4h-5V38H84v4h5v38h5v4h4v5h15v-5h-5v-4Z"
              />
              <path
                d="M167 84h4v5h-23v-5h4V52h-4v-5h4v-5h5v-4h5v-5h4v51h1Zm0-70h-15v14h15V14Z"
              />
              <path
                d="M223 80h-5v4h-26v-4h5v-5h5v-5h4v-4h5v-5h5v-5h4v-4h5V38h-37v-5h-5v9h-5v10h5v-5h5v-5h28v5h-5v5h-5v4h-4v5h-5v5h-5v4h-4v5h-5v5h-5v9h45v-5h4v-9h-4v5Z"
              />
              <path
                d="M324 80h-5v-5h-5v-5h-4v-4h-5v-5h-5v-5h10v-4h4v-5h5V23h-5v-4h-4v-5h-52v5h9v65h-9v5h33v-5h-10V61h5v5h5v4h5v5h4v5h5v4h5v5h23v-5h-9v-4Zm-43-28V19h19v4h5v24h-5v5h-19Z"
              />
              <path
                d="M387 47h-5v-5h-9v-4h-19v4h-9v5h-5v9h-5v14h5v10h5v4h9v5h19v-5h9v-4h5V70h5V56h-5v-9Zm-9 23h-5v10h-5v4h-9v-4h-5V70h-5V56h5v-9h5v-5h9v5h5v9h5v14Z"
              />
              <path
                d="M425 77h4v12h-4v9h-5v-9h-5V77h-5V66h-4V54h-5V42h-7v-4h28v4h-7v12h5v12h5v11Zm4 0h5V66h-5v11Zm3-35h7v12h4V42h7v-4h-18v4Zm2 24h5V54h-5v12Zm-19 37h-5v5h-14v9h14v-4h5v-5h5V98h-5v5Z"
              />
              <path
                d="M492 89v-5h-9v-4h5V61h-5v-5h5v-9h-5v-5h-9v5h-5v5h-14v-5h5v-5h4v-4h28v4h5v5h5v37h5v5h-15Zm-18-9h-5V70h5v-4h9v-5h-14v5h-9v4h-5v10h5v4h4v5h19v-5h-9v-4Z"
              />
              <path
                d="M551 103h-5v5h-9v-5h-5V0h-4v5h-5v4h-5v5h-4v5h4v84h-4v5h-10v-5h-4v14h-5v10h5v-5h4v-5h5v-5h9v29h3v9h9v-9h2v-29h10v5h4v5h5v5h5v-10h-5v-14Z"
              />
              <path
                d="M593 80h-4v-5h4v5Zm-37-24v14h5v10h4v4h19v5h-28v-5h-5v-4h-5V70h-4V56h4v-9h5v-5h5v-4h28v4h5v5h4v9h-37Zm0-4h23v-5h-4v-5h-14v5h-5v5Zm33 28h-5v4h5v-4Z"
              />
            </g>
          </svg>
        </h1>
      </a>
      <!-- Topics -->
      <div
        class="flex flex-col items-center justify-center flex-1 w-full space-y-6 lg:space-y-8"
        x-data="{ row1: [], row2: [], row3: [], all: [] }"
        x-init="
          all = $store.game.topics;
          row1 = all.slice(0, 8);
          row2 = all.slice(8, 16);
          row3 = all.slice(16, 24);
        "
      >
        <h2 class="font-sans text-2xl md:text-4xl lg:text-4xl">
          Scegli un argomento
        </h2>

        <!-- Mobile / Tablet: griglia fissa con tutti i topic -->
        <div
          class="grid w-full grid-cols-2 gap-2 cursor-pointer md:grid-cols-3 md:gap-3 lg:hidden"
        >
          <template x-for="(topic, index) in all" :key="'grid-' + index">
            <a
              class="flex items-center justify-center px-2 py-2.5 md:px-3 md:py-3 font-sans text-xs md:text-sm text-black text-center transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
              x-text="topic.label"
              :href="'game.html?topic=' + topic.slug"
            ></a>
          </template>
        </div>

        <!-- Desktop: marquee infinite scroll -->
        <div
          class="flex-col items-center justify-center hidden w-full space-y-8 cursor-pointer lg:flex whitespace-nowrap"
        >
          <!-- Row 1 - scrolls right -->
          <div class="marquee-container">
            <div class="marquee-track marquee-track-right">
              <template x-for="(topic, index) in row1" :key="'r1a-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
              <template x-for="(topic, index) in row1" :key="'r1b-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
            </div>
          </div>

          <!-- Row 2 - scrolls left -->
          <div class="marquee-container">
            <div class="marquee-track marquee-track-left">
              <template x-for="(topic, index) in row2" :key="'r2a-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
              <template x-for="(topic, index) in row2" :key="'r2b-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
            </div>
          </div>

          <!-- Row 3 - scrolls right -->
          <div class="marquee-container">
            <div class="marquee-track marquee-track-right">
              <template x-for="(topic, index) in row3" :key="'r3a-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
              <template x-for="(topic, index) in row3" :key="'r3b-' + index">
                <a
                  class="px-4 py-2 font-sans text-2xl text-black transition-colors duration-300 ease-in-out bg-white border-2 border-white hover:border-darkblue"
                  x-text="topic.label"
                  :href="'game.html?topic=' + topic.slug"
                ></a>
              </template>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
