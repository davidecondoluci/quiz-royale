<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Royale - Game</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body class="bg-white">
    <main x-data="quiz()" class="flex flex-col w-full lg:flex-row h-dvh">
      <!-- Sidebar -->
      <div
        id="game-view"
        class="flex flex-col w-full lg:w-1/2 h-2/5 md:h-1/2 lg:h-full justify-between items-center p-2 md:p-4 lg:p-16 bg-cyan bg-[url('/img/bg_game.png')] bg-bottom bg-no-repeat bg-cover"
      >
        <!-- Boss -->
        <div
          class="flex flex-col items-center justify-start w-full space-y-1 h-1/2 md:space-y-2 lg:space-y-4"
        >
          <div
            id="boss-hp"
            class="flex flex-wrap items-center justify-center gap-1"
          >
            <template x-for="heart in bossHp">
              <img src="/img/hp_1.png" class="w-4 h-4 lg:w-8 lg:h-8" />
            </template>
            <template x-for="heart in bossDamage">
              <img src="/img/hp_0.png" class="w-4 h-4 lg:w-8 lg:h-8" />
            </template>
          </div>
          <img
            id="boss-img"
            src="/img/boss.png"
            :src="currentQuestionIndex >= 30 ? '/img/injured_boss.png' : '/img/boss.png'"
            class="w-auto mx-auto h-2/3"
          />
        </div>
        <!-- Player -->
        <div
          class="flex flex-col items-center justify-end w-full space-y-1 h-1/2 md:space-y-2 lg:space-y-4"
        >
          <img
            id="player-img"
            :src="playerImage"
            class="flex w-auto mx-auto h-2/4 top-4"
          />
          <div
            id="player-hp"
            class="flex flex-wrap items-center justify-center gap-1"
          >
            <template x-for="heart in playerHp">
              <img src="/img/hp_1.png" class="w-4 h-4 lg:w-8 lg:h-8" />
            </template>
            <template x-for="heart in playerDamage">
              <img src="/img/hp_0.png" class="w-4 h-4 lg:w-8 lg:h-8" />
            </template>
          </div>
        </div>
      </div>
      <!-- Quiz -->
      <div
        id="quiz-view"
        x-show="state == 'game'"
        class="flex flex-col items-center justify-between w-full p-3 bg-white h-3/5 md:h-1/2 lg:w-1/2 lg:h-full md:p-6 lg:p-16"
      >
        <!-- Logo -->
        <a
          href="index.html"
          class="block w-full max-w-[200px] md:max-w-[180px] lg:max-w-xs"
        >
          <h1>
            <svg
              class="w-full overflow-visible"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 594 150"
              fill="none"
            >
              <g fill="#000">
                <path
                  d="M52 89v-5h9v-4h5v-5h4v-9h5V38h-5V28h-4v-5h-5v-4h-9v-5H23v5h-9v4H9v5H5v10H0v28h5v9h4v5h5v4h9v5h5v5h5v4h9v5h14v5h19v-5H61v-5h-9v-4h-5v-5h5Zm-24-5v-4h-5v-5h-4v-9h-5V38h5V28h4v-5h5v-4h19v4h5v5h4v10h5v28h-5v9h-4v5h-5v4H28Z"
                />
                <path
                  d="M141 84v5h-19v-9h-5v-5h5V42h-5v-4h19v46h5Zm-28 0h4v-4h-4v4Zm-5-4h-5V38H84v4h5v38h5v4h4v5h15v-5h-5v-4Z"
                />
                <path
                  d="M167 84h4v5h-23v-5h4V52h-4v-5h4v-5h5v-4h5v-5h4v51h1Zm0-70h-15v14h15V14Z"

                <path
                  d="M223 80h-5v4h-26v-4h5v-5h5v-5h4v-4h5v-5h5v-5h4v-4h5V38h-37v-5h-5v9h-5v10h5v-5h5v-5h28v5h-5v5h-5v4h-4v5h-5v5h-5v4h-4v5h-5v5h-5v9h45v-5h4v-9h-4v5Z"
                />
                <path
                  d="M324 80h-5v-5h-5v-5h-4v-4h-5v-5h-5v-5h10v-4h4v-5h5V23h-5v-4h-4v-5h-52v5h9v65h-9v5h33v-5h-10V61h5v5h5v4h5v5h4v5h5v4h5v5h23v-5h-9v-4Zm-43-28V19h19v4h5v24h-5v5h-19Z"

                />

                />

                  d="M551 103h-5v5h-9v-5h-5V0h-4v5h-5v4h-5v5h-4v5h4v84h-4v5h-10v-5h-4v14h-5v10h5v-5h4v-5h5v-5h9v29h3v9h9v-9h2v-29h10v5h4v5h5v5h5v-10h-5v-14Z"
                />
                <path
                  d="M593 80h-4v-5h4v5Zm-37-24v14h5v10h4v4h19v5h-28v-5h-5v-4h-5V70h-4V56h4v-9h5v-5h5v-4h28v4h5v5h4v9h-37Zm0-4h23v-5h-4v-5h-14v5h-5v5Zm33 28h-5v4h5v-4Z"
                />
              </g>
            </svg>
          </h1>
        </a>
        <!-- Questions and Answers -->
        <div class="flex flex-col w-full space-y-2 md:space-y-3 lg:space-y-4">
          <h2
            x-text="currentQuestion ? currentQuestion.domanda : ''"
            class="text-sm text-center md:text-xl lg:text-2xl min-h-12 md:min-h-16 lg:min-h-24"
          ></h2>

          <template x-if="currentQuestion">
            <template x-for="answer in currentQuestion.risposte">
              <button
                id="answer"
                x-text="answer"
                @click="answerQuestion(answer)"
                class="text-sm md:text-lg lg:text-2xl font-serif px-3 py-1.5 md:px-4 md:py-2 lg:px-16 lg:py-4 bg-midgray text-white border-2 border-darkgray hover:bg-darkgray hover:text-white transition-colors duration-300 ease-in-out"
              ></button>
            </template>
          </template>
        </div>
        <!-- Number of questions and Exit -->
        <div class="flex flex-row items-center justify-between w-full">
          <div x-show="state == 'game'" class="flex w-1/2">
            <p class="font-sans text-xs md:text-sm lg:text-base">
              Domanda <span x-text="questionCounter"></span>/30
            </p>
          </div>
          <a
            @click="exitGame"
            class="font-serif text-xs md:text-sm lg:text-base px-4 py-1.5 md:px-8 md:py-2 bg-red text-white hover:bg-darkred transition-colors duration-300 ease-in-out cursor-pointer"
          >
            Esci
          </a>
        </div>
      </div>

      <!-- Game over -->
      <div
        x-show="state == 'lose'"
        x-cloak
        class="flex flex-col items-center justify-center w-full p-4 space-y-4 text-center text-black bg-white h-3/5 md:h-1/2 lg:w-1/2 lg:h-full lg:justify-start lg:p-16 md:space-y-8 lg:space-y-12"
      >
        <!-- Logo -->
        <a
          href="index.html"
          class="block w-full max-w-[140px] md:max-w-[180px] lg:max-w-xs"
        >
          <h1>
            <svg
              class="w-full overflow-visible"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 594 150"
              fill="none"
            >
              <g fill="#000">
                <path
                  d="M52 89v-5h9v-4h5v-5h4v-9h5V38h-5V28h-4v-5h-5v-4h-9v-5H23v5h-9v4H9v5H5v10H0v28h5v9h4v5h5v4h9v5h5v5h5v4h9v5h14v5h19v-5H61v-5h-9v-4h-5v-5h5Zm-24-5v-4h-5v-5h-4v-9h-5V38h5V28h4v-5h5v-4h19v4h5v5h4v10h5v28h-5v9h-4v5h-5v4H28Z"

                />

                  d="M425 77h4v12h-4v9h-5v-9h-5V77h-5V66h-4V54h-5V42h-7v-4h28v4h-7v12h5v12h5v11Zm4 0h5V66h-5v11Zm3-35h7v12h4V42h7v-4h-18v4Zm2 24h5V54h-5v12Zm-19 37h-5v5h-14v9h14v-4h5v-5h5V98h-5v5Z"
                />

                />
                <path
                  d="M551 103h-5v5h-9v-5h-5V0h-4v5h-5v4h-5v5h-4v5h4v84h-4v5h-10v-5h-4v14h-5v10h5v-5h4v-5h5v-5h9v29h3v9h9v-9h2v-29h10v5h4v5h5v5h5v-10h-5v-14Z"
                />
                <path
                  d="M593 80h-4v-5h4v5Zm-37-24v14h5v10h4v4h19v5h-28v-5h-5v-4h-5V70h-4V56h4v-9h5v-5h5v-4h28v4h5v5h4v9h-37Zm0-4h23v-5h-4v-5h-14v5h-5v5Zm33 28h-5v4h5v-4Z"
                />
              </g>
            </svg>
          </h1>
        </a>
        <!-- Game over message -->
        <div class="flex flex-col space-y-2 md:space-y-6 lg:space-y-8">
          <h3 class="text-4xl md:text-7xl lg:text-9xl">Hai perso!</h3>
          <p class="text-xs md:text-sm lg:text-base">
            Non scoraggiarti, puoi sempre riprovare o cambiare argomento
          </p>
          <!-- Buttons -->
          <div
            class="flex flex-col flex-wrap items-center justify-center w-full gap-2 lg:flex-row md:gap-4"
          >
            <button
              @click="restartGame"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-blue text-white hover:bg-darkblue transition-colors duration-300 ease-in-out"
            >
              Ricomincia
            </button>
            <button
              @click="changeTopic"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-green text-white hover:bg-darkgreen transition-colors duration-300 ease-in-out"
            >
              Cambia Argomento
            </button>
            <button
              @click="exitGame"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-red text-white hover:bg-darkred transition-colors duration-300 ease-in-out cursor-pointer"
            >
              Esci
            </button>
          </div>
        </div>
      </div>

      <!-- Victory -->
      <div
        x-show="state == 'win'"
        x-cloak
        class="flex flex-col items-center justify-center w-full p-3 space-y-3 text-center text-black bg-white h-3/5 md:h-1/2 lg:w-1/2 lg:h-full md:p-6 lg:p-16 md:space-y-6 lg:space-y-12"
      >
        <!-- Logo -->
        <a
          href="index.html"
          class="block w-full max-w-[120px] md:max-w-[180px] lg:max-w-xs"
        >
          <h1>
            <svg
              class="w-full overflow-visible"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 594 150"
              fill="none"
            >
              <g fill="#000">
                <path
                  d="M52 89v-5h9v-4h5v-5h4v-9h5V38h-5V28h-4v-5h-5v-4h-9v-5H23v5h-9v4H9v5H5v10H0v28h5v9h4v5h5v4h9v5h5v5h5v4h9v5h14v5h19v-5H61v-5h-9v-4h-5v-5h5Zm-24-5v-4h-5v-5h-4v-9h-5V38h5V28h4v-5h5v-4h19v4h5v5h4v10h5v28h-5v9h-4v5h-5v4H28Z"

                  d="M593 80h-4v-5h4v5Zm-37-24v14h5v10h4v4h19v5h-28v-5h-5v-4h-5V70h-4V56h4v-9h5v-5h5v-4h28v4h5v5h4v9h-37Zm0-4h23v-5h-4v-5h-14v5h-5v5Zm33 28h-5v4h5v-4Z"
                />
              </g>
            </svg>
          </h1>
        </a>
        <!-- Victory message -->
        <div class="flex flex-col space-y-2 md:space-y-6 lg:space-y-8">
          <h3 class="text-4xl md:text-7xl lg:text-9xl">Hai vinto!</h3>
          <p class="text-xs md:text-sm lg:text-base">
            Complimenti, sei riuscito a sconfiggere il boss
          </p>
          <!-- Buttons -->
          <div
            class="flex flex-col flex-wrap items-center justify-center w-full gap-2 lg:flex-row md:gap-4"
          >
            <button
              @click="restartGame"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-blue text-white hover:bg-darkblue transition-colors duration-300 ease-in-out"

              Ricomincia
            </button>
            <button
              @click="changeTopic"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-green text-white hover:bg-darkgreen transition-colors duration-300 ease-in-out"
            >
              Cambia Argomento
            </button>
            <a
              @click="exitGame"
              class="text-sm md:text-lg lg:text-2xl font-serif px-6 py-1.5 md:px-8 md:py-2 bg-red text-white hover:bg-darkred transition-colors duration-300 ease-in-out cursor-pointer"
            >
              Esci
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
